<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Teal with Luminous Border -->
    <linearGradient id="bgGradMortar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02151a" />
      <stop offset="50%" stop-color="#052831" />
      <stop offset="100%" stop-color="#0a3945" />
    </linearGradient>

    <linearGradient id="borderGradMortar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <!-- Mortar Bowl Gradient (Luminous filled gradient) -->
    <linearGradient id="mortarBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="mortarRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Pestle Gradient -->
    <linearGradient id="pestleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- DNA Helix & Cross Gradient -->
    <linearGradient id="helixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowMortar" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2dd4bf" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGradMortar)" />
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="url(#borderGradMortar)" stroke-width="8" />

  <!-- Background Ambient Glow Core -->
  <circle cx="256" cy="250" r="145" fill="#2dd4bf" fill-opacity="0.16" />

  <g filter="url(#neonGlowMortar)">
    <!-- 1. Outer Halo Orbital Ring -->
    <path 
      d="M 125 240 C 125 155, 175 90, 256 90 C 337 90, 387 155, 387 240" 
      fill="none" 
      stroke="url(#mortarRimGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
    />

    <!-- 2. Medical Cross Crown at the Apex (Top) -->
    <rect x="244" y="52" width="24" height="46" rx="6" fill="#ffffff" />
    <rect x="233" y="63" width="46" height="24" rx="6" fill="#ffffff" />
    <circle cx="256" cy="75" r="5" fill="#06b6d4" />

    <!-- 3. Luminous DNA Helix Strands (Ascending from Mortar to Cross) -->
    <!-- Left Sinusoidal Strand -->
    <path 
      d="M 230 220 Q 212 185 240 155 Q 268 125 248 100" 
      fill="none" 
      stroke="url(#helixGrad)" 
      stroke-width="8" 
      stroke-linecap="round" 
    />
    <!-- Right Sinusoidal Strand -->
    <path 
      d="M 282 220 Q 300 185 272 155 Q 244 125 264 100" 
      fill="none" 
      stroke="url(#helixGrad)" 
      stroke-width="8" 
      stroke-linecap="round" 
    />

    <!-- Base-Pair Molecular Rungs -->
    <line x1="222" y1="198" x2="290" y2="198" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round" />
    <line x1="242" y1="168" x2="270" y2="168" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="234" y1="138" x2="278" y2="138" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round" />
    <line x1="250" y1="112" x2="262" y2="112" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- 4. Pestle (Alu) Extending Angled Out of the Mortar Bowl -->
    <!-- Pestle Body -->
    <path 
      d="M 238 275 
         L 330 162 
         C 336 154, 348 152, 356 158 
         C 364 164, 366 176, 358 184 
         L 262 295 Z" 
      fill="url(#pestleGrad)" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linejoin="round" 
    />
    <!-- Pestle Rounded Bulbous Head -->
    <circle cx="352" cy="168" r="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="4" />

    <!-- 5. Mortar Bowl Base (Solid Luminous Filled Body) -->
    <path 
      d="M 112 245 
         C 112 360, 185 410, 256 410 
         C 327 410, 400 360, 400 245 
         C 365 265, 305 275, 256 275 
         C 207 275, 147 265, 112 245 Z" 
      fill="url(#mortarBodyGrad)" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linejoin="round" 
    />

    <!-- Mortar Inner Concave Lip Highlight -->
    <path 
      d="M 112 245 
         C 147 265, 207 275, 256 275 
         C 305 275, 365 265, 400 245 
         C 365 230, 305 220, 256 220 
         C 207 220, 147 230, 112 245 Z" 
      fill="#032b35" 
      stroke="url(#mortarRimGrad)" 
      stroke-width="8" 
    />

    <!-- Specular Crescent Shine on Mortar Bowl Exterior -->
    <path 
      d="M 140 280 C 145 350, 195 385, 256 392" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-opacity="0.75" 
    />

    <!-- 6. Pedestal Stand of the Mortar Bowl -->
    <path 
      d="M 205 410 
         L 194 440 
         Q 256 448 318 440 
         L 307 410 Z" 
      fill="url(#mortarRimGrad)" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linejoin="round" 
    />

    <!-- Center Medicine Sparkle -->
    <circle cx="256" cy="335" r="8" fill="#ffffff" />
    <circle cx="256" cy="335" r="4" fill="#0f766e" />
  </g>
</svg>
