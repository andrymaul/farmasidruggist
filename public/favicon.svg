<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradFav2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02151a" />
      <stop offset="50%" stop-color="#052831" />
      <stop offset="100%" stop-color="#0a3945" />
    </linearGradient>

    <linearGradient id="borderGradFav2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="mortarBodyGradFav2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="mortarRimGradFav2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="pestleGradFav2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="neonGlowFav2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2dd4bf" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGradFav2)" />
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="url(#borderGradFav2)" stroke-width="10" />

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="250" r="145" fill="#2dd4bf" fill-opacity="0.2" />

  <g filter="url(#neonGlowFav2)">
    <!-- Halo Ring -->
    <path 
      d="M 125 240 C 125 155, 175 90, 256 90 C 337 90, 387 155, 387 240" 
      fill="none" 
      stroke="url(#mortarRimGradFav2)" 
      stroke-width="16" 
      stroke-linecap="round" 
    />

    <!-- Medical Cross Crown -->
    <rect x="242" y="48" width="28" height="52" rx="7" fill="#ffffff" />
    <rect x="230" y="60" width="52" height="28" rx="7" fill="#ffffff" />
    <circle cx="256" cy="74" r="6" fill="#06b6d4" />

    <!-- DNA Helix Strands -->
    <path d="M 228 220 Q 210 185 240 155 Q 270 125 248 98" fill="none" stroke="#67e8f9" stroke-width="9" stroke-linecap="round" />
    <path d="M 284 220 Q 302 185 272 155 Q 242 125 264 98" fill="none" stroke="#67e8f9" stroke-width="9" stroke-linecap="round" />
    <line x1="220" y1="198" x2="292" y2="198" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="240" y1="168" x2="272" y2="168" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="232" y1="138" x2="280" y2="138" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Pestle (Alu) -->
    <path 
      d="M 238 275 L 332 160 C 340 150, 354 150, 362 158 C 370 166, 370 180, 360 188 L 262 295 Z" 
      fill="url(#pestleGradFav2)" 
      stroke="#ffffff" 
      stroke-width="6" 
    />
    <circle cx="355" cy="166" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="5" />

    <!-- Mortar Bowl Base -->
    <path 
      d="M 110 245 C 110 365, 185 415, 256 415 C 327 415, 402 365, 402 245 C 365 265, 305 275, 256 275 C 207 275, 147 265, 110 245 Z" 
      fill="url(#mortarBodyGradFav2)" 
      stroke="#ffffff" 
      stroke-width="7" 
    />

    <!-- Mortar Lip Highlight -->
    <path 
      d="M 110 245 C 147 265, 207 275, 256 275 C 305 275, 365 265, 402 245 C 365 230, 305 220, 256 220 C 207 220, 147 230, 110 245 Z" 
      fill="#032b35" 
      stroke="url(#mortarRimGradFav2)" 
      stroke-width="9" 
    />

    <!-- Pedestal Stand -->
    <path d="M 205 415 L 192 444 Q 256 452 320 444 L 307 415 Z" fill="url(#mortarRimGradFav2)" stroke="#ffffff" stroke-width="6" />

    <!-- Center Medicine Sparkle -->
    <circle cx="256" cy="335" r="9" fill="#ffffff" />
    <circle cx="256" cy="335" r="4" fill="#0f766e" />
  </g>
</svg>
