<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Teal -->
    <linearGradient id="bgGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021418" />
      <stop offset="50%" stop-color="#06252d" />
      <stop offset="100%" stop-color="#0a323c" />
    </linearGradient>

    <!-- Outer Squircle Ring Gradient -->
    <linearGradient id="borderGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shield & Monogram Gradient: Radiant Cyan to Mint Emerald -->
    <linearGradient id="shieldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Capsule Core Gradient -->
    <linearGradient id="capsuleGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="48%" stop-color="#06b6d4" />
      <stop offset="52%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2dd4bf" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGradFav)" />
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="url(#borderGradFav)" stroke-width="10" />

  <!-- Background Subtle Ambient Radial Glow -->
  <circle cx="256" cy="256" r="140" fill="#2dd4bf" fill-opacity="0.15" />

  <!-- Outer Shield Frame Contour -->
  <g filter="url(#neonGlowFav)">
    <path 
      d="M 256 76 
         C 310 88, 382 96, 412 116 
         C 418 120, 420 128, 420 138 
         C 420 236, 388 340, 260 428 
         C 257.5 429.8, 254.5 429.8, 252 428 
         C 124 340, 92 236, 92 138 
         C 92 128, 94 120, 100 116 
         C 130 96, 202 88, 256 76 Z" 
      fill="none" 
      stroke="url(#shieldGradFav)" 
      stroke-width="18" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
    />

    <!-- MONOGRAM "F" (Left Inner Shield) -->
    <path 
      d="M 132 148 
         L 132 284 
         C 132 320, 168 360, 224 394 
         M 132 152 
         L 230 152 
         M 132 232 
         L 208 232" 
      fill="none" 
      stroke="url(#shieldGradFav)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- MONOGRAM "D" (Right Inner Shield) -->
    <path 
      d="M 282 152 
         L 326 152 
         C 372 152, 380 186, 380 232 
         C 380 286, 362 338, 288 394 
         M 282 152 
         L 282 205
         M 282 295
         L 282 390" 
      fill="none" 
      stroke="url(#shieldGradFav)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Horizontal Clinical Cross Wings -->
    <rect 
      x="172" 
      y="238" 
      width="168" 
      height="36" 
      rx="12" 
      fill="url(#shieldGradFav)" 
    />

    <!-- Vertical Pill Capsule -->
    <rect 
      x="218" 
      y="176" 
      width="76" 
      height="160" 
      rx="38" 
      fill="url(#capsuleGradFav)" 
      stroke="#ffffff" 
      stroke-width="8" 
    />

    <!-- Capsule Center Dividing Waistline -->
    <line 
      x1="218" 
      y1="256" 
      x2="294" 
      y2="256" 
      stroke="#ffffff" 
      stroke-width="5" 
    />

    <!-- Glowing White Medical Cross in Top Half of Capsule -->
    <rect x="250" y="200" width="12" height="36" rx="4" fill="#ffffff" />
    <rect x="238" y="212" width="36" height="12" rx="4" fill="#ffffff" />

    <!-- Specular Highlight on Capsule -->
    <path 
      d="M 234 192 C 234 186, 240 182, 248 182" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linecap="round" 
    />

    <!-- Bottom Half Medicine Sparkle Dot -->
    <circle cx="256" cy="296" r="8" fill="#34d399" />
    <circle cx="256" cy="296" r="4" fill="#ffffff" />
  </g>
</svg>
