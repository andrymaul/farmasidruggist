<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Logo Resmi FARMASIDRUGGIST</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #07252f 0%, #031115 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: rgba(8, 38, 45, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 28px;
      padding: 2.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(45, 212, 191, 0.15);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(45, 212, 191, 0.15);
      border: 1px solid rgba(45, 212, 191, 0.4);
      color: #2dd4bf;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #99f6e4 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .logo-preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .preview-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(45, 212, 191, 0.3));
      transition: transform 0.3s ease;
    }
    .preview-img:hover {
      transform: scale(1.05);
    }
    .preview-label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #14b8a6 0%, #22d3ee 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(45, 212, 191, 0.5);
      transform: translateY(-2px);
    }
    .btn-amber {
      background: #fbbf24;
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(251, 191, 36, 0.35);
    }
    .btn-amber:hover {
      background: #f59e0b;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Aset Branding Resmi</div>
    <h1>Logo FARMASIDRUGGIST Resmi</h1>
    <p class="sub">Emblem Swirl Botanik &amp; Monogram Farmasi Druggist • Resolusi Asli</p>

    <div class="logo-preview-box">
      <div class="preview-item">
        <img src="/logo.png" alt="Logo Resmi PNG" class="preview-img" style="border-radius: 20px;">
        <span class="preview-label">Logo Resmi Asli (PNG)</span>
      </div>
      <div class="preview-item">
        <img src="/logo.svg" alt="Vektor SVG" class="preview-img" id="svgImg">
        <span class="preview-label">Vektor Scalable (SVG)</span>
      </div>
    </div>

    <div class="buttons-grid">
      <!-- Direct download PNG -->
      <a href="/logo.png" download="FarmasiDruggist-Logo.png" class="btn btn-primary">
        <span>📥 Unduh Logo Asli (PNG)</span>
      </a>

      <!-- Direct download SVG -->
      <a href="/logo.svg" download="FarmasiDruggist-Logo.svg" class="btn btn-amber">
        <span>🖼️ Unduh Format Scalable (SVG)</span>
      </a>

      <!-- Generate and download PNG 1024px via Canvas -->
      <button onclick="downloadAsPNG(1024)" class="btn btn-secondary">
        <span>⚡ Unduh PNG (1024x1024)</span>
      </button>

      <!-- Generate and download PNG 512px via Canvas -->
      <button onclick="downloadAsPNG(512)" class="btn btn-secondary">
        <span>⚡ Unduh PNG (512x512)</span>
      </button>
    </div>

    <canvas id="exportCanvas" style="display: none;"></canvas>
  </div>

  <footer>
    © 2026 FARMASIDRUGGIST • Drug &amp; Clinical Interaction Database
  </footer>

  <script>
    function downloadAsPNG(size) {
      const img = document.getElementById('svgImg');
      const canvas = document.getElementById('exportCanvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      const newImg = new Image();
      newImg.crossOrigin = 'anonymous';
      newImg.onload = function() {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(newImg, 0, 0, size, size);
        const a = document.createElement('a');
        a.download = `FarmasiDruggist-Logo-${size}x${size}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      newImg.src = '/logo.svg';
    }
  </script>
</body>
</html>
